name: Qoder Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  qoder-assistant:
    if: |
      contains(github.event.comment.body, '@qoder') &&
      !endsWith(github.event.comment.user.login, '[bot]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build Arguments
        id: build_args
        env:
          EV_REPO: ${{ github.repository }}
          EV_EVENT: ${{ github.event_name }}
          EV_NODE_ID: ${{ github.event.comment.node_id }}
          EV_COMMENT_ID: ${{ github.event.comment.id }}
          EV_AUTHOR: ${{ github.event.comment.user.login }}
          EV_BODY: ${{ github.event.comment.body }}
          EV_URL: ${{ github.event.comment.html_url }}
          EV_IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' }}
          EV_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          EV_REVIEW_ID: ${{ github.event.comment.pull_request_review_id }}
          EV_REPLY_TO: ${{ github.event.comment.in_reply_to_id }}
        run: |
          ARGS="REPO: $EV_REPO
          REQUEST_SOURCE: $EV_EVENT
          THREAD_ID: $EV_NODE_ID
          COMMENT_ID: $EV_COMMENT_ID
          AUTHOR: $EV_AUTHOR
          BODY: $EV_BODY
          URL: $EV_URL
          IS_PR: $EV_IS_PR
          ISSUE_OR_PR_NUMBER: $EV_NUMBER"

          if [ -n "$EV_REVIEW_ID" ]; then
            ARGS="$ARGS
          REVIEW_ID: $EV_REVIEW_ID"
          fi

          if [ -n "$EV_REPLY_TO" ]; then
            ARGS="$ARGS
          REPLY_TO_COMMENT_ID: $EV_REPLY_TO"
          fi

          delim="ARGS_$(openssl rand -hex 16)"
          { echo "args<<$delim"; printf '%s\n' "$ARGS"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Run Qoder Assistant
        uses: QoderAI/qoder-action@0881d27d15a7a93778ebc5c942d11da313ee8b7e # v0 (v0.1.0-beta.3)
        with:
          qoder_personal_access_token: ${{ secrets.QODERCN_PERSONAL_ACCESS_TOKEN }}
          prompt: |
            /assistant
            ${{ steps.build_args.outputs.args }}
